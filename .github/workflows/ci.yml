name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python（数据/模型/回测/模拟盘/API）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: 单元测试（离线 fixtures，不联网）
        run: python -m pytest tests/ -q --ignore=tests/test_cloud_contract.py
      - name: CLI 冒烟（--help 可执行）
        run: |
          python -m quant.cli --help > /dev/null
          python -c "import quant, quant.cli, quant.config; print(quant.__version__)"

  worker:
    name: Cloudflare Worker（TS/parity/打包）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: TypeScript 类型检查
        run: npx tsc --noEmit
      - name: 双端推理 parity（Python vs TS，<1e-6）
        run: node test/parity.mjs
      - name: D1 schema 校验
        run: node scripts/check-schema.mjs
      - name: esbuild 打包自检
        run: node scripts/check-bundle.mjs
      - name: wrangler 配置 dry-run
        run: npx wrangler deploy --dry-run --outdir dist
