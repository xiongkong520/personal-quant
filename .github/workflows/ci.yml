name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python（数据/模型/回测/模拟盘/API）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: 环境自检
        run: |
          python -c "import quant; print('quant', quant.__version__)"
          python -m pip freeze | grep -iE "pandas|numpy|scikit|scipy|akshare|fastapi|pytest|joblib|starlette"
      - name: 单元测试（离线 fixtures，不联网）
        run: |
          set +e
          python -m pytest tests/ -q --ignore=tests/test_cloud_contract.py --tb=short -p no:cacheprovider > /tmp/pytest.log 2>&1
          rc=$?
          echo "pytest exit=$rc"
          tail -40 /tmp/pytest.log
          if [ "$rc" -ne 0 ]; then
            {
              echo "## pytest 失败 (exit $rc)"
              echo ""
              echo '```'
              tail -200 /tmp/pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

  worker:
    name: Cloudflare Worker（TS/parity/打包）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: TypeScript 类型检查
        run: npx tsc --noEmit
      - name: 双端推理 parity（Python vs TS，<1e-6）
        run: node test/parity.mjs
      - name: D1 schema 校验
        run: node scripts/check-schema.mjs
      - name: esbuild 打包自检
        run: node scripts/check-bundle.mjs
      - name: wrangler 配置 dry-run
        run: npx wrangler deploy --dry-run --outdir dist
