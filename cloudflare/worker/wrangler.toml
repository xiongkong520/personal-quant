# 个人量化工作台 · Cloudflare Worker
# 本地开发（无需 Cloudflare 账号）：npx wrangler dev --local --port 8788
# 真实部署前须：wrangler login 或设置 CLOUDFLARE_API_TOKEN，并把 database_id 换成真实 D1 id。
name = "personal-quant-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# D1（本地 --local 模式使用 .wrangler/state 下的本地 SQLite，不需要账号）
[[d1_databases]]
binding = "DB"
database_name = "personal_quant"
database_id = "b236f430-bf64-4b11-9ac8-829744a654b2" # personal_quant（2026-11-21 创建，WNAM）
migrations_dir = "migrations"

# 静态看板（Pages 产物）由 Worker 的 Assets 绑定提供：
#   /api/* 由 Worker 处理，其余路径命中 cloudflare/pages/ 下的静态文件。
[assets]
directory = "../pages"
binding = "ASSETS"

[observability]
enabled = false

[dev]
port = 8788
local_protocol = "http"

# 公开配置（非密钥）。真实 Turnstile sitekey（2026-11-21 创建，域名 personal-quant-worker.xiongkong520.workers.dev）
[vars]
TURNSTILE_SITEKEY = "0x4AAAAAAGLKrUEtVV-vcN0y"
WORKER_PUBLIC_URL = "https://quant-board-9y2.pages.dev"

# 生产限流建议绑定 KV（本地 --local 不需要，会自动用内存 Map）：
#   npx wrangler kv namespace create RATE_LIMIT_KV
#   npx wrangler kv namespace create RATE_LIMIT_KV --preview
# 然后把下面注释打开并填入返回的 id：
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<namespace id>"

# 盘中实时刷新（Cron 由 Cloudflare 触发，不依赖设备）
# */3：每 3 分钟预热 /api/market-overview 与 /api/market 的 60s 缓存
#      没有它时每个冷请求都要现抓 5 指数 + 宽度 + 板块（10~20 秒），前端 12 秒超时直接空白
[triggers]
crons = ["*/3 * * * *", "*/5 1-7 * * 1-5", "35 3 * * 1-5", "5 7 * * 1-5", "40 7 * * 1-5"]
